<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>btasio</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>btasio</h1>
      <p class="tag">hub Bluetooth · sin marca · stereo / mid-side</p>
    </div>
    <div id="status" class="pill">…</div>
  </header>
  <section class="presets">
    <button data-preset="stereo_sub">Stereo + Sub</button>
    <button data-preset="mid_side">Mid / Side</button>
    <button data-preset="all">Todos</button>
  </section>
  <section class="master">
    <label>Master</label>
    <input id="master" type="range" min="0" max="1.5" step="0.01" value="1" />
    <span id="masterVal">1.00</span>
  </section>
  <section id="sinks" class="sinks"></section>
  <section class="actions">
    <button id="scan">Buscar parlantes</button>
    <button id="refresh" class="ghost">Refrescar</button>
    <button id="apply" class="ghost">Aplicar graph</button>
  </section>
  <section id="found" class="found" hidden></section>
  <pre id="log"></pre>
  <script src="/static/app.js"></script>
</body>
</html>
