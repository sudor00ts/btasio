name: android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: materialize android platform
        working-directory: app
        run: |
          flutter create . --org ar.tullio --project-name btasio --platforms=android
          echo "--- build.gradle.kts before ---"
          cat android/app/build.gradle.kts || true
          # Force compileSdk 36 (plugins require it)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle || true
          # Fallback: any compileSdk line
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          echo "--- build.gradle.kts after ---"
          cat android/app/build.gradle.kts || true
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: btasio-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
