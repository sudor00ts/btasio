name: android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: materialize android platform
        working-directory: app
        run: |
          flutter create . --org ar.tullio --project-name btasio --platforms=android
          # App-level
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          # Force all plugins (file_picker etc.) to compileSdk 36
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
                      compileSdkVersion(36)
                  }
              }
          }
          EOF
          echo "--- root build.gradle.kts ---"
          cat android/build.gradle.kts || true
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: btasio-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
