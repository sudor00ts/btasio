name: android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: materialize android platform
        working-directory: app
        run: |
          flutter create . --org ar.tullio --project-name btasio --platforms=android
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          # Force all plugins to compileSdk 36 using AGP 9 DSL
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
                      compileSdk = 36
                  }
              }
          }
          EOF
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: btasio-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
