name: android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: materialize android platform
        working-directory: app
        run: |
          flutter create . --org ar.tullio --project-name btasio --platforms=android
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          flutter pub get
          # Patch every plugin that hardcodes an old compileSdk
          find "$HOME/.pub-cache" -path '*/android/build.gradle*' -print0 | while IFS= read -r -d '' f; do
            if grep -qE 'compileSdk(Version)?[[:space:]=]+[0-9]+' "$f"; then
              echo "patching $f"
              sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$f" || true
              sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$f" || true
            fi
          done
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: btasio-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
