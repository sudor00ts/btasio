name: btasio
description: Host + receiver Bluetooth-agnostic multi-speaker matrix over Wi-Fi.
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.4
  flutter_pcm_sound: ^3.3.3
  network_info_plus: ^6.1.3
  permission_handler: ^11.3.1
  playback_capture: ^0.0.4
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
